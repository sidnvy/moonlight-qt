---
name: Build

on:
  push:
    branches:
      - work/main
    tags:
      - "v*"
  pull_request:
    branches:
      - work/main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      ci_version: ${{ steps.set-ci-version.outputs.ci_version }}
    steps:
      - name: Set CI version
        id: set-ci-version
        shell: bash
        run: |
          CI_VERSION=`echo ${GITHUB_SHA} | cut -c1-6`
          echo "ci_version=${CI_VERSION}" >> "${GITHUB_OUTPUT}"

  build-appimage:
    needs: setup
    uses: ./.github/workflows/build-appimage.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}

  build-windows-macos:
    needs: setup
    secrets: inherit
    uses: ./.github/workflows/build-win-mac.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [setup, build-appimage, build-windows-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: Moonlight-*
          path: dist
          merge-multiple: false

      - name: Package release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp dist/Moonlight-LinuxAppImage-*/*.AppImage release-assets/
          cp dist/Moonlight-macOS-*/*.dmg release-assets/
          for dir in dist/Moonlight-Windows-x64-* dist/Moonlight-Windows-arm64-*; do
            name="$(basename "$dir")"
            python3 -c 'import shutil, sys; shutil.make_archive(sys.argv[1], "zip", sys.argv[2])' "release-assets/${name}" "$dir"
          done
          ls -la release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
